<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- dark brownish background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3a2c1c"/>
      <stop offset="70%" stop-color="#241a10"/>
      <stop offset="100%" stop-color="#160f08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8cd8a"/>
      <stop offset="45%" stop-color="#cda657"/>
      <stop offset="100%" stop-color="#9a7a36"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- outer ring -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#cda657" stroke-width="4" opacity="0.85"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#cda657" stroke-width="1.5" opacity="0.4"/>

  <g fill="url(#gold)">
    <!-- four radiating Orokin "blade" petals (N,E,S,W) -->
    <g>
      <!-- north -->
      <path d="M128 36
               C 140 70, 150 92, 128 120
               C 106 92, 116 70, 128 36 Z"/>
      <!-- south -->
      <path d="M128 220
               C 140 186, 150 164, 128 136
               C 106 164, 116 186, 128 220 Z"/>
      <!-- east -->
      <path d="M220 128
               C 186 140, 164 150, 136 128
               C 164 106, 186 116, 220 128 Z"/>
      <!-- west -->
      <path d="M36 128
               C 70 140, 92 150, 120 128
               C 92 106, 70 116, 36 128 Z"/>
    </g>

    <!-- diagonal smaller accents -->
    <g opacity="0.9">
      <path d="M170 86 C 168 104, 160 112, 144 112 C 152 96, 156 90, 170 86 Z"/>
      <path d="M86 86  C 104 88, 112 96, 112 112 C 96 104, 90 100, 86 86 Z"/>
      <path d="M170 170 C 152 168, 144 160, 144 144 C 160 152, 166 156, 170 170 Z"/>
      <path d="M86 170 C 88 152, 96 144, 112 144 C 104 160, 100 166, 86 170 Z"/>
    </g>

    <!-- central diamond -->
    <path d="M128 104 L 150 128 L 128 152 L 106 128 Z"/>
  </g>
  <!-- center stone -->
  <circle cx="128" cy="128" r="9" fill="#241a10"/>
  <circle cx="128" cy="128" r="9" fill="none" stroke="#e8cd8a" stroke-width="2"/>
</svg>
